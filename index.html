<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malaysia Fertilizer Derivative Tool</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; color: #333; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #2e7d32; text-align: center; }
        .stats-box { display: flex; justify-content: space-around; margin-bottom: 20px; padding: 15px; background: #e8f5e9; border-radius: 8px; }
        .stat-item { text-align: center; }
        .val { font-size: 1.5rem; font-weight: bold; color: #1b5e20; }
        .desc { font-size: 0.9rem; color: #666; }
        #data-info { margin-top: 15px; padding: 10px; border-left: 5px solid #2e7d32; background: #fafafa; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h2>Fertilizer Consumption Rate (Malaysia)</h2>
    <p>Click on any data point to calculate the <b>First Derivative</b> (Annual Rate of Change).</p>

    <div class="stats-box">
        <div class="stat-item">
            <div class="desc">Selected Year</div>
            <div id="year-val" class="val">-</div>
        </div>
        <div class="stat-item">
            <div class="desc">Usage (kg/ha)</div>
            <div id="usage-val" class="val">-</div>
        </div>
        <div class="stat-item">
            <div class="desc">Rate of Change (Δ)</div>
            <div id="deriv-val" class="val">-</div>
        </div>
    </div>

    <canvas id="fertilizerChart"></canvas>

    <div id="data-info">
        Select a point on the graph to see how the usage intensity is trending.
    </div>
</div>

<script>
    // Real-world approximate data based on World Bank/FAO trends for Malaysia
    const dataPoints = [
        { year: 2014, usage: 1580 },
        { year: 2015, usage: 1610 },
        { year: 2016, usage: 1635 },
        { year: 2017, usage: 1640 }, // Peak area
        { year: 2018, usage: 1625 },
        { year: 2019, usage: 1590 },
        { year: 2020, usage: 1550 },
        { year: 2021, usage: 1510 },
        { year: 2022, usage: 1460 },
        { year: 2023, usage: 1410 },
        { year: 2024, usage: 1360 }
    ];

    const ctx = document.getElementById('fertilizerChart').getContext('2d');
    const chart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: dataPoints.map(d => d.year),
            datasets: [{
                label: 'Fertilizer Consumption (kg per hectare of arable land)',
                data: dataPoints.map(d => d.usage),
                borderColor: '#2e7d32',
                backgroundColor: 'rgba(46, 125, 50, 0.1)',
                borderWidth: 3,
                fill: true,
                tension: 0.4,
                pointRadius: 6,
                pointHoverRadius: 10
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { display: true }
            },
            onClick: (evt, activeElements) => {
                if (activeElements.length > 0) {
                    const index = activeElements[0].index;
                    const current = dataPoints[index];
                    
                    // Calculating the simple derivative: (f(x) - f(x-1)) / (x - (x-1))
                    let derivative = 0;
                    let contextText = "";

                    if (index > 0) {
                        derivative = (current.usage - dataPoints[index - 1].usage).toFixed(2);
                    } else {
                        derivative = (dataPoints[index + 1].usage - current.usage).toFixed(2);
                    }

                    document.getElementById('year-val').innerText = current.year;
                    document.getElementById('usage-val').innerText = current.usage + " kg";
                    document.getElementById('deriv-val').innerText = (derivative > 0 ? "+" : "") + derivative + " kg/yr";

                    if (derivative > 0) {
                        contextText = `In ${current.year}, usage was increasing. This suggests agricultural expansion.`;
                    } else if (derivative < 0) {
                        contextText = `In ${current.year}, the derivative is negative (${derivative}). This reflects a shift toward precision farming and sustainability (MSPO/MyGAP).`;
                    } else {
                        contextText = `In ${current.year}, usage hit a plateau (Derivative ≈ 0).`;
                    }
                    document.getElementById('data-info').innerText = contextText;
                }
            }
        }
    });
</script>

</body>
</html>
